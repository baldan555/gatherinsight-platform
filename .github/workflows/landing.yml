# Landing page: build the nginx image, test the container, push it, roll it out, and confirm the live site
# serves exactly the committed files.

name: Landing page

on:
  push:
    branches: [main]
    paths: ["landing/**", ".github/workflows/landing.yml"]
  pull_request:
    paths: ["landing/**", ".github/workflows/landing.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT_ID: gatherinsight
  REGION: asia-southeast1
  SERVICE: gatherinsight-landing
  IMAGE: asia-southeast1-docker.pkg.dev/gatherinsight/landing/site
  SITE: https://gatherinsight.baldanproject.my.id
  WIF_PROVIDER: projects/1021483580038/locations/global/workloadIdentityPools/gi-github/providers/github-oidc
  DEPLOY_SA: gh-deploy-landing@gatherinsight.iam.gserviceaccount.com

jobs:
  test:
    name: Build and test the container
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Every image the pages use is in the repository
        run: |
          missing=0
          for f in $(grep -ohE '(img|preview)/[A-Za-z0-9._/-]+\.(webp|png|svg)' landing/index.html landing/id.html | sort -u); do
            [ -f "landing/$f" ] || { echo "::error file=landing/index.html::missing landing/$f"; missing=1; }
          done
          exit $missing

      - name: Build
        run: docker build -t landing:test landing

      - name: Serve it and check the responses
        run: |
          docker run -d --name site -p 8080:8080 landing:test
          for i in $(seq 1 20); do curl -fs -o /dev/null localhost:8080/ && break; sleep 1; done
          for page in index.html id.html; do
            path="/$page"; [ "$page" = index.html ] && path="/"
            curl -fsS "localhost:8080${path}" | cmp -s - "landing/$page" \
              || { echo "::error::${path} does not serve landing/${page}"; exit 1; }
            echo "ok  ${path} serves landing/${page}"
          done
          curl -fsS -o /dev/null -w "ok  /favicon.svg %{http_code} %{content_type}\n" localhost:8080/favicon.svg
          img="$(ls landing/img | head -1)"
          curl -fsSI "localhost:8080/img/${img}" | grep -i '^cache-control' | sed 's/^/ok  images: /'
          curl -fsSI localhost:8080/ | grep -i '^x-content-type-options: nosniff' >/dev/null && echo "ok  security headers"

  deploy:
    name: Deploy to Cloud Run
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: landing-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}
          token_format: access_token

      - uses: google-github-actions/setup-gcloud@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build and push
        id: image
        run: |
          ref="${IMAGE}:${GITHUB_SHA::12}"
          docker build --label "org.opencontainers.image.revision=${GITHUB_SHA}" -t "$ref" landing
          docker push "$ref"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"

      # Only the image changes; identity, scaling (min 0 / max 3) and access are defined in Terraform.
      - name: Roll out
        run: |
          gcloud run deploy "$SERVICE" --image "${{ steps.image.outputs.ref }}" \
            --region "$REGION" --project "$PROJECT_ID" --quiet

      - name: The live site serves this commit
        run: |
          url="$(gcloud run services describe "$SERVICE" --region "$REGION" --project "$PROJECT_ID" --format='value(status.url)')"
          for base in "$url" "$SITE"; do
            curl -fsS "${base}/" | cmp -s - landing/index.html || { echo "::error::${base}/ is not serving this commit"; exit 1; }
            curl -fsS "${base}/id.html" | cmp -s - landing/id.html || { echo "::error::${base}/id.html is not serving this commit"; exit 1; }
            echo "ok  ${base}"
          done
          revision="$(gcloud run services describe "$SERVICE" --region "$REGION" --project "$PROJECT_ID" --format='value(status.latestReadyRevisionName)')"
          { echo "### Landing page deployed"; echo; echo "Revision \`${revision}\` (image \`${{ steps.image.outputs.ref }}\`) is live at ${SITE}"; } >> "$GITHUB_STEP_SUMMARY"
