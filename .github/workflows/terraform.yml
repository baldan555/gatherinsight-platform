# Infrastructure as code.
#   Pull request -> fmt, validate, and a read-only plan posted on the pull request.
#   Push to main -> plan, refuse anything that deletes or replaces a resource, then apply.
#   Every Monday -> plan only; fails if the live project has drifted from this code.

name: Terraform

on:
  push:
    branches: [main]
    paths: ["infra/**", ".github/workflows/terraform.yml"]
  pull_request:
    paths: ["infra/**", ".github/workflows/terraform.yml"]
  schedule:
    - cron: "0 1 * * 1" # Monday 08:00 in Jakarta
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"
  TF_VERSION: "1.17.1"
  WIF_PROVIDER: projects/1021483580038/locations/global/workloadIdentityPools/gi-github/providers/github-oidc

defaults:
  run:
    working-directory: infra

jobs:
  check:
    name: Format and validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - run: terraform fmt -check -recursive -diff
      - run: terraform init -backend=false
      - run: terraform validate

  plan:
    name: ${{ github.event_name == 'pull_request' && 'Plan (read-only)' || github.event_name == 'schedule' && 'Drift check' || 'Plan and apply' }}
    needs: check
    # Pull requests from forks get no cloud credentials at all.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      # Pull requests can only use the read-only identity; main uses the one that may apply.
      CI_SA: ${{ github.event_name == 'pull_request' && 'gh-terraform-plan@gatherinsight.iam.gserviceaccount.com' || 'gh-terraform@gatherinsight.iam.gserviceaccount.com' }}
      LOCK: ${{ github.event_name == 'pull_request' && 'false' || 'true' }}
    steps:
      - uses: actions/checkout@v5

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.CI_SA }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - run: terraform init

      - name: Plan
        id: plan
        run: |
          set +e
          terraform plan -no-color -lock="$LOCK" -detailed-exitcode -out=tfplan > plan.txt 2>&1
          code=$?
          set -e
          cat plan.txt
          echo "exitcode=${code}" >> "$GITHUB_OUTPUT"
          [ "$code" -eq 1 ] && exit 1
          terraform show -json tfplan > plan.json
          {
            echo "### Terraform plan"
            echo
            if [ "$code" -eq 0 ]; then
              echo "No changes: the project matches the code."
            else
              grep -E '^Plan:' plan.txt || true
              echo
              jq -r '.resource_changes[] | select(.change.actions != ["no-op"]) | "- `\(.change.actions | join("/"))` \(.address)"' plan.json
            fi
          } | tee summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Refuse plans that delete or replace anything
        if: steps.plan.outputs.exitcode == '2'
        run: |
          doomed="$(jq -r '.resource_changes[] | select(.change.actions | index("delete")) | .address' plan.json)"
          if [ -n "$doomed" ]; then
            echo "::error title=Destructive plan::This plan would delete or replace: $(echo $doomed). Apply it deliberately from a workstation instead."
            exit 1
          fi
          echo "No deletions or replacements."

      - name: Post the plan on the pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('infra/summary.md', 'utf8') +
              `\n\n<sub>Read-only plan by \`gh-terraform-plan\` for ${context.sha.slice(0, 12)}. Full output in the workflow log.</sub>`;
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });

      - name: Report drift
        if: github.event_name == 'schedule' && steps.plan.outputs.exitcode == '2'
        run: |
          echo "::error title=Drift detected::The live project no longer matches infra/. See the plan above."
          exit 1

      - name: Apply
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.plan.outputs.exitcode == '2'
        run: terraform apply -no-color tfplan
